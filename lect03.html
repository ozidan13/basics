<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CSS من الألف للياء — CodeHub Game</title>
<meta name="description" content="المحاضرة التالتة — Selectors، Box Model، Flexbox، Grid، Responsive، Animations و Variables">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b14;
  --rail:#0b1120;
  --surface:#0f172a;
  --surface-2:#152038;
  --surface-3:#1b2946;
  --code-bg:#070c17;
  --border:rgba(148,179,224,.14);
  --border-hi:rgba(148,179,224,.28);
  --spec:inset 0 1px 0 rgba(255,255,255,.06);
  --text:#f3f6fc;
  --text-soft:#cfd9eb;
  --muted:#8598b8;
  --ok:#10b981;
  --info:#38bdf8;
  --bad:#f43f5e;
  --warn:#f59e0b;
  --primary:linear-gradient(100deg,#10b981,#06b6d4);
  --on-primary:#031317;
  --accent:#f97316;
  --accent2:#fbbf24;
  --r:15px;
  --r-sm:10px;
  --font:'IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif;
  --display:'Readex Pro','IBM Plex Sans Arabic',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
bdi,code{unicode-bidi:isolate}
code{
  font-family:var(--mono);font-size:.85em;font-weight:500;
  background:color-mix(in srgb,var(--accent) 12%,rgba(148,163,184,.14));
  border:1px solid color-mix(in srgb,var(--accent) 18%,transparent);
  padding:.08em .42em;border-radius:6px;color:#fde68a;direction:ltr;display:inline-block;
}
.ltr{direction:ltr;text-align:left;unicode-bidi:isolate}
.ic{width:16px;height:16px;display:inline-block;vertical-align:-.2em;flex-shrink:0}
.ic-sm{width:14px;height:14px}.ic-lg{width:19px;height:19px}

/* ─── Scrollbar (Contained, Subtle) ─────────────────────────────────────── */
.scroll{overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:rgba(148,163,184,.28) transparent}
.scroll::-webkit-scrollbar{width:6px;height:6px}
.scroll::-webkit-scrollbar-thumb{background:rgba(148,163,184,.28);border-radius:99px}
.scroll::-webkit-scrollbar-thumb:hover{background:rgba(148,163,184,.45)}
.scroll-x{overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}

/* ─── Root Full-Viewport App Shell (L1, L2) ─────────────────────────────── */
.app{
  position:relative;display:grid;height:100vh;height:100dvh;min-height:0;overflow:hidden;
  grid-template-rows:56px minmax(0,1fr);
  background:
    radial-gradient(680px 300px at 92% 0%,color-mix(in srgb,var(--accent) 13%,transparent),transparent 68%),
    radial-gradient(620px 320px at 6% 100%,color-mix(in srgb,var(--accent2) 9%,transparent),transparent 70%),
    radial-gradient(480px 260px at 50% 45%,rgba(56,189,248,.04),transparent 72%),
    var(--bg);
}
.topbar,.studio,.rail,.workspace,.ws-body,.doc-grid,.doc-col,.game-shell,.playfield{min-width:0;min-height:0}

/* ─── Top App Bar ───────────────────────────────────────────────────────── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:0 16px;background:rgba(8,13,25,.9);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);position:relative;z-index:10;
}
.topbar::after{
  content:'';position:absolute;inset-inline:0;bottom:-1px;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--accent) 42%,transparent) 50%,transparent);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-mark{
  width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#070b14;
  box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 34%,transparent),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .2s var(--ease);
}
.brand-mark:hover{transform:rotate(-4deg) scale(1.04)}
.brand-mark svg{width:20px;height:20px}
.brand-txt{min-width:0}
.brand-title{font-family:var(--display);font-size:15.5px;font-weight:700;letter-spacing:-.01em;line-height:1.22;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:11.5px;color:var(--muted);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.top-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.prog-ring-chip{
  display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 6px;border-radius:99px;
  background:rgba(255,255,255,.04);border:1px solid var(--border);
  font-family:var(--display);font-size:12px;font-weight:700;color:var(--text-soft);
}
.ring-svg{width:24px;height:24px;transform:rotate(-90deg);flex-shrink:0}
.ring-bg{fill:none;stroke:rgba(148,163,184,.2);stroke-width:3}
.ring-fg{fill:none;stroke:url(#gradRing);stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .55s var(--ease)}

.stat-pill{
  display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:99px;
  font-family:var(--display);font-size:12.5px;font-weight:700;border:1px solid var(--border);background:rgba(255,255,255,.04);
}
.stat-pill.xp{color:#fde68a;border-color:rgba(245,158,11,.34);background:linear-gradient(135deg,rgba(245,158,11,.14),rgba(249,115,22,.08))}
.stat-pill.xp.bump{animation:xpBump .4s var(--ease)}
.stat-pill.combo{color:#fb923c;border-color:rgba(249,115,22,.46);background:rgba(249,115,22,.16);animation:pop .26s var(--ease)}
.top-btn{
  display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 11px;border-radius:10px;
  border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text-soft);
  font-size:12.5px;font-weight:600;transition:background .16s,border-color .16s,color .16s,transform .14s;
}
.top-btn:hover,.top-btn.active{
  background:color-mix(in srgb,var(--accent) 14%,rgba(56,189,248,.1));
  border-color:color-mix(in srgb,var(--accent) 44%,transparent);color:#fff;
}
.top-btn:active{transform:scale(.97)}

/* ─── 2-Pane CodeHub Studio (Right Rail + Full Left Workspace) ──────────── */
.studio{
  display:grid;height:100%;overflow:hidden;
  grid-template-columns:clamp(244px,19.8vw,292px) minmax(0,1fr);
  gap:10px;padding:10px;
}

/* ─── Right Section Tabs Rail (All Open, Zero Locks!) ───────────────────── */
.rail{
  display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,rgba(14,22,40,.96),var(--rail));
  border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--spec);
}
.rail-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:11px 13px 10px;border-bottom:1px solid var(--border);flex-shrink:0;
}
.rail-head strong{font-family:var(--display);font-size:13px;font-weight:700;color:var(--text);white-space:nowrap}
.rail-open-tag{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#34d399;
  padding:2px 8px;border-radius:99px;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.24);white-space:nowrap;
}
.rail-list{flex:1;display:flex;flex-direction:column;gap:5px;padding:8px}
.sec-tab{
  position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:right;
  padding:9px 11px;border-radius:11px;border:1px solid transparent;background:transparent;
  transition:background .16s,border-color .16s,transform .16s var(--ease);flex-shrink:0;overflow:hidden;
}
.sec-tab::before{
  content:'';position:absolute;inset-block:8px;inset-inline-start:0;width:3px;border-radius:99px;
  background:linear-gradient(180deg,var(--accent),var(--accent2));opacity:0;transform:scaleY(.35);
  transition:opacity .2s var(--ease),transform .2s var(--ease);
}
.sec-tab:hover{background:rgba(255,255,255,.045);border-color:var(--border)}
.sec-tab.active{
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 18%,rgba(21,32,56,.96)),rgba(15,23,42,.95));
  border-color:color-mix(in srgb,var(--accent) 52%,transparent);
  box-shadow:0 8px 22px rgba(0,0,0,.26),var(--spec);
}
.sec-tab.active::before{opacity:1;transform:scaleY(1)}
.sec-tab.boss.active{
  background:linear-gradient(135deg,rgba(244,63,94,.22),rgba(15,23,42,.96));
  border-color:rgba(244,63,94,.56);
}
.sec-tab.boss.active::before{background:linear-gradient(180deg,#fb7185,#f43f5e)}
.sec-num{
  width:31px;height:31px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;
  font-family:var(--display);font-size:12px;font-weight:700;background:rgba(255,255,255,.055);
  color:var(--muted);border:1px solid var(--border);transition:all .18s var(--ease);
}
.sec-tab.active .sec-num{
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#070b14;border-color:transparent;
  box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 34%,transparent);
}
.sec-tab.done .sec-num{background:rgba(16,185,129,.18);color:#34d399;border-color:rgba(16,185,129,.38)}
.sec-tab.boss .sec-num{background:rgba(244,63,94,.16);color:#fb7185;border-color:rgba(244,63,94,.36)}
.sec-tab.boss.active .sec-num{background:linear-gradient(135deg,#f43f5e,#fb7185);color:#fff}
.sec-info{min-width:0;flex:1}
.sec-title{font-family:var(--display);font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.sec-meta{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:2px;font-size:11px;color:var(--muted)}
.mini-stars{display:inline-flex;gap:1px;align-items:center}
.mini-stars svg{width:11px;height:11px;color:#2c3b57}
.mini-stars svg.lit{color:#fbbf24;filter:drop-shadow(0 0 4px rgba(251,191,36,.35))}
.rail-foot{
  padding:9px 11px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:6px;flex-shrink:0;
}
.rail-link{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--info);text-decoration:none}
.rail-link:hover{text-decoration:underline;color:#bae6fd}

/* ─── Left Active Workspace ─────────────────────────────────────────────── */
.workspace{
  position:relative;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,rgba(16,25,45,.96),var(--surface));
  border:1px solid var(--border);border-radius:var(--r);
  box-shadow:0 18px 46px rgba(0,0,0,.32),var(--spec);
}
.ws-header{
  position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:11px 18px;border-bottom:1px solid var(--border);
  background:
    radial-gradient(420px 140px at 95% 0%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 72%),
    rgba(10,17,32,.78);
  flex-shrink:0;overflow:hidden;
}
.ws-deco{position:absolute;inset-inline-end:0;top:0;height:100%;width:220px;pointer-events:none;opacity:.22;color:var(--accent)}
.ws-heading{display:flex;align-items:center;gap:11px;min-width:0;position:relative;z-index:1}
.ws-badge{
  display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:9px;
  font-family:var(--display);font-size:12px;font-weight:700;flex-shrink:0;
  background:color-mix(in srgb,var(--accent) 15%,rgba(15,23,42,.6));color:var(--accent2);
  border:1px solid color-mix(in srgb,var(--accent) 36%,transparent);
}
.ws-heading h1{font-family:var(--display);margin:0;font-size:clamp(16px,1.5vw,20px);font-weight:700;letter-spacing:-.015em;line-height:1.25}
.ws-en{font-size:12px;color:var(--muted);font-weight:500;direction:ltr}

/* Segmented Mode Switcher: Explain <-> Play */
.mode-switch{
  display:inline-grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;position:relative;z-index:1;
  border-radius:12px;background:rgba(6,11,22,.88);border:1px solid var(--border);flex-shrink:0;
}
.mode-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:36px;padding:0 15px;border-radius:8px;font-family:var(--display);font-size:13px;font-weight:600;
  color:var(--muted);transition:all .18s var(--ease);white-space:nowrap;border:1px solid transparent;
}
.mode-btn:hover{color:var(--text)}
.mode-btn.active.explain{
  background:linear-gradient(135deg,rgba(56,189,248,.18),rgba(99,102,241,.14));
  color:#e0f2fe;border-color:rgba(56,189,248,.38);box-shadow:var(--spec);
}
.mode-btn.active.play{
  background:linear-gradient(135deg,rgba(16,185,129,.22),rgba(6,182,212,.18));
  color:#d1fae5;border-color:rgba(16,185,129,.45);box-shadow:var(--spec);
}

/* Sub-tabs Strip */
.sub-bar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:8px 18px;border-bottom:1px solid var(--border);background:rgba(8,14,26,.52);flex-shrink:0;
}
.pill-row{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.sub-pill{
  display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 13px;
  border-radius:9px;border:1px solid var(--border);background:rgba(255,255,255,.03);
  color:var(--text-soft);font-size:13px;font-weight:600;white-space:nowrap;flex-shrink:0;
  transition:all .16s var(--ease);
}
.sub-pill:hover{background:rgba(255,255,255,.075);border-color:var(--border-hi);transform:translateY(-1px)}
.sub-pill.active{
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 22%,transparent),color-mix(in srgb,var(--accent2) 10%,transparent));
  border-color:color-mix(in srgb,var(--accent) 56%,transparent);color:#fff;box-shadow:var(--spec);
}
.sub-pill.solved{border-color:rgba(16,185,129,.42);color:#a7f3d0;background:rgba(16,185,129,.11)}
.sub-pill.solved.active{background:rgba(16,185,129,.24);border-color:var(--ok);color:#fff}
.hearts-bar{display:inline-flex;align-items:center;gap:4px;color:#fb7185;font-family:var(--display);font-size:13px;font-weight:700;flex-shrink:0}
.hearts-bar svg{width:16px;height:16px}
.hearts-bar svg.lost{color:#475569;opacity:.55}

.ws-body{flex:1;overflow:hidden;display:flex;flex-direction:column}

/* ─── MODE 1: INTERACTIVE TEACHING STUDIO («افهم الشرح») ─────────────────── */
.doc-grid{
  flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.06fr);
  gap:16px;padding:16px 18px;overflow:auto;align-content:start;
  animation:viewIn .24s var(--ease);
}
.doc-grid.single{grid-template-columns:minmax(0,920px);justify-content:center}
.doc-col{display:flex;flex-direction:column;gap:12px}
.doc-card{
  padding:17px 19px;border-radius:var(--r);
  background:linear-gradient(180deg,rgba(23,34,58,.95),var(--surface-2));
  border:1px solid var(--border);box-shadow:var(--spec);
  display:flex;flex-direction:column;gap:11px;flex-shrink:0;
}
.doc-card h2{font-family:var(--display);margin:0;font-size:18.5px;font-weight:700;color:#fff;line-height:1.38;letter-spacing:-.01em}
.doc-p{margin:0;font-size:15px;line-height:1.85;color:var(--text-soft)}
.doc-p strong{color:#fff;font-weight:700}

/* Egyptian Callouts (Analogy / Tip / Warning) */
.callout{
  display:flex;align-items:flex-start;gap:11px;padding:12px 14px;border-radius:12px;
  font-size:14.5px;line-height:1.78;
}
.callout.analogy{background:rgba(245,158,11,.09);border:1px solid rgba(245,158,11,.24);border-right:3.5px solid var(--warn);color:#fef3c7}
.callout.tip{background:rgba(16,185,129,.09);border:1px solid rgba(16,185,129,.24);border-right:3.5px solid var(--ok);color:#d1fae5}
.callout.warn{background:rgba(244,63,94,.09);border:1px solid rgba(244,63,94,.24);border-right:3.5px solid var(--bad);color:#ffe4e6}
.callout-ico{
  width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;margin-top:2px;
  background:rgba(255,255,255,.07);
}
.callout.analogy .callout-ico{color:#fbbf24;background:rgba(245,158,11,.15)}
.callout.tip .callout-ico{color:#34d399;background:rgba(16,185,129,.15)}
.callout.warn .callout-ico{color:#fb7185;background:rgba(244,63,94,.16)}
.callout strong{color:#fff}

/* Structured Mini-Cards & Clean Tables in Docs */
.info-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:10px}
.info-card{
  padding:12px 14px;border-radius:11px;background:rgba(9,16,30,.72);
  border:1px solid var(--border);box-shadow:var(--spec);
  display:flex;flex-direction:column;gap:5px;transition:border-color .16s;
}
.info-card:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--border))}
.info-card-h{font-family:var(--display);font-size:13.5px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:6px}
.info-card-d{font-size:13.5px;color:var(--text-soft);line-height:1.65}

.doc-table-wrap{overflow:auto;border-radius:11px;border:1px solid var(--border);background:rgba(9,16,30,.72)}
.doc-table{width:100%;border-collapse:collapse;font-size:13.5px}
.doc-table th,.doc-table td{padding:9px 12px;border-bottom:1px solid var(--border);text-align:right;line-height:1.55}
.doc-table th{font-family:var(--display);background:rgba(255,255,255,.045);color:var(--accent2);font-size:12px;font-weight:700}
.doc-table tr:last-child td{border-bottom:0}

/* Code Window + Live Browser / Console Mockup */
.win-frame{border-radius:13px;overflow:hidden;border:1px solid var(--border-hi);background:var(--code-bg);flex-shrink:0;box-shadow:0 10px 26px rgba(0,0,0,.28)}
.win-bar{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 13px;background:#0e172a;border-bottom:1px solid var(--border);direction:ltr;
}
.win-dots{display:flex;gap:6px}.win-dots i{width:10px;height:10px;border-radius:50%;display:block}
.win-title{font-family:var(--mono);font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.code-pre{
  margin:0;padding:13px 16px;font-family:var(--mono);font-size:13.5px;line-height:1.72;
  color:#e2e8f0;overflow:auto;white-space:pre;direction:ltr;text-align:left;unicode-bidi:isolate;
}
.code-pre code{display:block;background:none;border:0;padding:0;border-radius:0;color:inherit;font-size:inherit;direction:ltr;unicode-bidi:isolate}
.syn-tag{color:#7ee787;direction:ltr;unicode-bidi:isolate}.syn-attr{color:#79c0ff;direction:ltr;unicode-bidi:isolate}.syn-val{color:#ffa657;direction:ltr;unicode-bidi:isolate}
.syn-com{color:#7c8da6;font-style:italic;direction:ltr;unicode-bidi:isolate}.syn-kw{color:#ff7b72;direction:ltr;unicode-bidi:isolate}
.syn-num{color:#d2a8ff;direction:ltr;unicode-bidi:isolate}.syn-fn{color:#56d4dd;direction:ltr;unicode-bidi:isolate}

.console-frame{border-radius:13px;overflow:hidden;border:1px solid rgba(52,211,153,.3);background:#050b14;flex-shrink:0}
.console-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 13px;background:#0b1525;border-bottom:1px solid rgba(52,211,153,.18);direction:ltr;font-family:var(--mono);font-size:11.5px;color:#34d399}
.console-body{padding:11px 15px;font-family:var(--mono);font-size:13px;line-height:1.7;color:#a7f3d0;direction:ltr;text-align:left}
.console-line{display:flex;gap:8px;align-items:baseline}
.console-line::before{content:'›';color:#10b981;font-weight:700}

.browser-frame{border-radius:13px;overflow:hidden;border:1px solid rgba(148,179,224,.3);background:#fff;color:#0f172a;flex-shrink:0;box-shadow:0 10px 26px rgba(0,0,0,.22)}
.browser-bar{display:flex;align-items:center;gap:10px;padding:7px 12px;background:#1e293b;direction:ltr}
.browser-url{
  flex:1;display:flex;align-items:center;gap:6px;background:#0f172a;border:1px solid #334155;border-radius:7px;padding:3px 10px;
  font-family:var(--mono);font-size:11.5px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.browser-url svg{width:12px;height:12px;color:#34d399;flex-shrink:0}
.browser-body{padding:14px 16px;font-family:var(--font);font-size:14px;line-height:1.6;color:#1e293b;min-height:54px}
.browser-body h1{font-size:1.5em;margin:.15em 0;color:#0f172a}.browser-body h2{font-size:1.22em;margin:.15em 0;color:#0f172a}
.browser-body h3{font-size:1.05em;margin:.15em 0;color:#0f172a}.browser-body p{margin:.3em 0}
.browser-body a{color:#2563eb;text-decoration:underline}
.browser-body table{border-collapse:collapse;width:100%;font-size:.88em}
.browser-body th,.browser-body td{border:1px solid #cbd5e1;padding:5px 8px}
.browser-body th{background:#f1f5f9}
.browser-body blockquote{border-right:3px solid #94a3b8;padding:4px 10px;margin:4px 0;color:#475569;font-style:italic;background:#f8fafc}
.browser-foot{
  padding:6px 12px;background:#ecfdf5;border-top:1px solid #d1fae5;
  font-size:12px;font-weight:700;color:#047857;display:flex;align-items:center;gap:6px;
}

/* Interactive X-Ray Spots inside Docs OR Game */
.spot{
  display:inline;font-family:var(--mono);font-size:inherit;padding:1px 6px;margin:0 1px;
  border-radius:6px;border:1px dashed var(--accent);background:color-mix(in srgb,var(--accent) 18%,transparent);
  color:#fff;transition:all .16s var(--ease);animation:spotPulse 2.6s ease-in-out infinite;
}
.spot:hover{background:color-mix(in srgb,var(--accent) 34%,transparent);transform:translateY(-1px)}
.spot.seen{border-style:solid;border-color:var(--ok);background:rgba(16,185,129,.22);color:#d1fae5;animation:none}
.spot.active{box-shadow:0 0 0 2px var(--info);animation:none}
.spot-readout{
  display:flex;align-items:flex-start;gap:9px;padding:11px 14px;border-radius:11px;
  background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.3);
  font-size:14px;line-height:1.68;color:#e0f2fe;animation:toastIn .2s var(--ease);
}
.spot-readout strong{color:#7dd3fc}

/* ─── MODE 2: INTERACTIVE GAME ARENA («العب وطبّق») ─────────────────────── */
.game-shell{
  flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;align-items:center;
}
.game-inner{
  width:100%;max-width:1040px;display:flex;flex-direction:column;gap:14px;
  animation:viewIn .24s var(--ease);
}
.mission-card{
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding:14px 18px;border-radius:var(--r);
  background:linear-gradient(180deg,rgba(23,34,58,.96),var(--surface-2));
  border:1px solid var(--border);box-shadow:var(--spec);
}
.mission-card h2{font-family:var(--display);margin:0;font-size:clamp(15.5px,1.4vw,18px);font-weight:700;line-height:1.45;outline:none;flex:1;min-width:220px}
.type-tag{
  display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;
  font-family:var(--display);font-size:12px;font-weight:700;flex-shrink:0;
  background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent2);
  border:1px solid color-mix(in srgb,var(--accent) 34%,transparent);
}
.playfield{
  display:flex;flex-direction:column;gap:14px;padding:18px;
  border-radius:var(--r);background:rgba(9,16,30,.78);border:1px solid var(--border);box-shadow:var(--spec);
}

/* Mechanics Styling (Spacious, Tactile, High-Contrast) */
.opt-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr))}
.opt-btn{
  display:flex;flex-direction:column;align-items:stretch;gap:10px;text-align:right;
  padding:14px 16px;border-radius:13px;border:1px solid var(--border-hi);
  background:linear-gradient(180deg,rgba(24,36,62,.95),var(--surface-2));
  min-height:54px;font-size:14.5px;font-weight:600;
  box-shadow:0 3px 0 rgba(0,0,0,.32),var(--spec);
  transition:transform .14s var(--ease),border-color .16s,background .16s,box-shadow .16s;
}
.opt-btn:hover:not(:disabled){border-color:var(--info);background:rgba(56,189,248,.11);transform:translateY(-2px);box-shadow:0 5px 0 rgba(0,0,0,.32),0 8px 20px rgba(56,189,248,.12)}
.opt-btn:active:not(:disabled){transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.opt-btn.ok{border-color:var(--ok);background:rgba(16,185,129,.2);color:#d1fae5;animation:okPop .3s var(--ease)}
.opt-btn.bad{border-color:var(--bad);background:rgba(244,63,94,.18);animation:shake .28s}
.opt-row{display:flex;align-items:center;gap:10px}
.opt-k{
  width:29px;height:29px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;
  background:color-mix(in srgb,var(--accent) 14%,rgba(255,255,255,.05));
  border:1px solid color-mix(in srgb,var(--accent) 26%,transparent);
  font-family:var(--display);font-size:13px;font-weight:700;color:var(--accent2);
}

/* Drag Chips & Drop Targets */
.tray{display:flex;flex-wrap:wrap;gap:9px;align-items:center;justify-content:center;padding:10px;border-radius:12px;background:rgba(6,11,22,.6);border:1px dashed var(--border-hi)}
.chip{
  display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:7px 14px;
  border-radius:10px;border:1px solid var(--border-hi);
  background:linear-gradient(180deg,#1e3156,#162544);
  font-size:14px;font-weight:600;user-select:none;touch-action:none;
  box-shadow:0 3px 0 rgba(0,0,0,.38),var(--spec);
  transition:transform .14s var(--ease),border-color .16s,background .16s,opacity .16s;
}
.chip.code-chip{font-family:var(--mono);direction:ltr;color:#f8fafc;font-size:13.5px}
.chip:hover{border-color:var(--info);transform:translateY(-2px)}
.chip.picked{border-color:var(--info);background:rgba(56,189,248,.24);box-shadow:0 0 0 2px rgba(56,189,248,.42)}
.chip.used{opacity:.28;pointer-events:none;box-shadow:none}
.chip.locked{border-color:var(--ok);background:rgba(16,185,129,.2);color:#d1fae5;cursor:default;box-shadow:none;animation:chipSnap .26s var(--ease)}
.chip.bad{border-color:var(--bad);background:rgba(244,63,94,.22);animation:shake .28s}
.drag-ghost{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-50%) rotate(-1.5deg) scale(1.06);box-shadow:0 18px 38px rgba(0,0,0,.55);border-color:var(--info)!important;background:#1f3863!important}
.drop-over{border-color:var(--info)!important;background:rgba(56,189,248,.18)!important;box-shadow:0 0 0 2px rgba(56,189,248,.3)}

.slot-blank{
  display:inline-flex;align-items:center;justify-content:center;min-width:82px;min-height:32px;
  padding:2px 10px;margin:0 3px;border-radius:7px;vertical-align:middle;
  border:1.5px dashed var(--info);background:rgba(56,189,248,.12);color:#7dd3fc;
  font-family:var(--mono);font-size:inherit;font-weight:700;transition:all .16s var(--ease);
}
.slot-blank.filled{border-style:solid;background:rgba(56,189,248,.24);color:#fff;animation:chipSnap .22s var(--ease)}
.slot-blank.ok{border-color:var(--ok);background:rgba(16,185,129,.26);color:#d1fae5;animation:okPop .28s var(--ease)}
.slot-blank.bad{border-color:var(--bad);background:rgba(244,63,94,.26);animation:shake .28s}

.buckets-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr))}
.bucket{
  display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:13px;
  border:1.5px dashed var(--border-hi);background:rgba(7,12,24,.65);min-height:112px;transition:all .16s var(--ease);
}
.bucket-h{font-family:var(--display);font-size:13.5px;font-weight:700;color:#7dd3fc;text-align:center;padding-bottom:7px;border-bottom:1px solid var(--border)}
.bucket-items{display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;flex:1}
.bucket.hint-glow{border-color:var(--warn);box-shadow:0 0 0 2px rgba(245,158,11,.38)}
.wireframe-page{display:grid;gap:8px;direction:ltr;grid-template-areas:"header header" "nav nav" "main aside" "footer footer";grid-template-columns:2.2fr 1fr}
.wireframe-table{display:grid;gap:8px;direction:ltr;grid-template-columns:1fr}
.wireframe-page .bucket,.wireframe-table .bucket{min-height:66px;padding:8px 10px}

.order-list{display:flex;flex-direction:column;gap:8px;width:100%}
.order-row{
  display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;
  border:1px solid var(--border-hi);background:linear-gradient(180deg,rgba(24,36,62,.95),var(--surface-2));
  min-height:50px;user-select:none;touch-action:none;box-shadow:var(--spec);transition:border-color .16s,background .16s;
}
.order-row:hover{border-color:var(--info)}
.order-row.ok{border-color:var(--ok);background:rgba(16,185,129,.18);animation:okPop .28s var(--ease)}
.order-row.bad{border-color:var(--bad);background:rgba(244,63,94,.16);animation:shake .28s}
.order-idx{
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;
  background:color-mix(in srgb,var(--accent) 16%,transparent);font-family:var(--display);font-size:13.5px;font-weight:700;color:var(--accent2);
}
.order-txt{flex:1;min-width:0;font-size:14.5px;font-weight:600}
.order-txt.mono{font-family:var(--mono);direction:ltr;text-align:left;font-size:13.5px}
.mv-btns{display:flex;gap:5px;flex-shrink:0}
.mv-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.05);display:grid;place-items:center;font-size:12px;transition:background .14s}
.mv-btn:hover:not(:disabled){background:rgba(56,189,248,.18);border-color:rgba(56,189,248,.4)}
.mv-btn:disabled{opacity:.28;cursor:not-allowed}

.bug-tok{
  display:inline;font-family:var(--mono);font-size:inherit;padding:2px 6px;border-radius:5px;
  border:1px solid rgba(148,163,184,.24);background:rgba(255,255,255,.045);color:inherit;transition:all .15s;
}
.bug-tok:hover{border-color:var(--warn);background:rgba(245,158,11,.2)}
.bug-tok.found{border-color:var(--ok);background:rgba(16,185,129,.24);color:#d1fae5;text-decoration:underline wavy var(--ok);animation:okPop .28s var(--ease)}
.bug-tok.safe-hit{border-color:var(--bad);background:rgba(244,63,94,.22);animation:shake .28s}

.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:stretch}
.match-col{display:flex;flex-direction:column;gap:8px}
.m-btn{
  width:100%;min-height:50px;padding:10px 14px;border-radius:12px;
  border:1px solid var(--border-hi);background:linear-gradient(180deg,rgba(24,36,62,.95),var(--surface-2));
  font-size:14px;font-weight:600;text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.3),var(--spec);transition:all .15s var(--ease);
}
.m-btn.mono-m{font-family:var(--mono);font-size:13.5px;direction:ltr}
.m-btn:hover:not(:disabled){border-color:var(--info);transform:translateY(-1px)}
.m-btn.picked{border-color:var(--info);background:rgba(56,189,248,.22);box-shadow:0 0 0 2px rgba(56,189,248,.38)}
.m-btn.ok{border-color:var(--ok);background:rgba(16,185,129,.2);color:#d1fae5;cursor:default;box-shadow:none;animation:okPop .28s var(--ease)}
.m-btn.bad{border-color:var(--bad);background:rgba(244,63,94,.2);animation:shake .28s}
.m-btn.hint-glow{border-color:var(--warn);box-shadow:0 0 0 2px rgba(245,158,11,.42)}

.patch-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(240px,.85fr);gap:14px;align-items:stretch}
.patch-ed{display:flex;flex-direction:column;gap:8px;min-width:0}
.chip-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ins-chip{
  font-family:var(--mono);font-size:12.5px;padding:5px 10px;border-radius:8px;direction:ltr;
  border:1px solid rgba(56,189,248,.38);background:rgba(56,189,248,.12);color:#7dd3fc;min-height:34px;font-weight:600;
  transition:background .14s,transform .12s;
}
.ins-chip:hover{background:rgba(56,189,248,.24);transform:translateY(-1px)}
.patch-ta{
  width:100%;min-height:138px;flex:1;resize:none;padding:12px 14px;border-radius:11px;
  border:1px solid var(--border-hi);background:var(--code-bg);color:#e2e8f0;
  font-family:var(--mono);font-size:13.5px;line-height:1.68;direction:ltr;text-align:left;
}
.patch-ta:focus{border-color:var(--info);outline:none;box-shadow:0 0 0 2px rgba(56,189,248,.22)}
.patch-prev{display:flex;flex-direction:column;border-radius:11px;overflow:hidden;border:1px solid #334155;background:#fff;min-height:138px}
.patch-prev iframe{border:0;width:100%;flex:1;min-height:118px;background:#fff}
.patch-checks{display:flex;flex-direction:column;border-radius:11px;overflow:hidden;border:1px solid var(--border-hi);background:var(--code-bg);min-height:138px}
.patch-check-list{padding:11px 13px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.pchk{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:9px;background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--text-soft);transition:all .18s}
.pchk.pass{background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.38);color:#a7f3d0}

/* ─── Action Dock (Bottom of Workspace) ─────────────────────────────────── */
.ws-dock{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 18px calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border);background:rgba(8,13,25,.94);flex-shrink:0;
}
.dock-g{display:flex;align-items:center;gap:8px;flex-shrink:0}
.btn-primary{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:42px;padding:0 19px;border-radius:11px;
  background:var(--primary);color:var(--on-primary);font-family:var(--display);font-size:13.5px;font-weight:700;
  box-shadow:0 5px 18px rgba(16,185,129,.28),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .14s var(--ease),filter .16s;white-space:nowrap;
}
.btn-primary:hover:not(:disabled){filter:brightness(1.07);transform:translateY(-1px)}
.btn-primary:active:not(:disabled){transform:scale(.97)}
.btn-primary:disabled{opacity:.38;cursor:not-allowed;box-shadow:none;transform:none}
.btn-sec{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:40px;padding:0 13px;border-radius:10px;
  border:1px solid var(--border-hi);background:rgba(255,255,255,.045);color:var(--text-soft);
  font-size:13px;font-weight:600;transition:background .15s,color .15s,border-color .15s;white-space:nowrap;
}
.btn-sec:hover:not(:disabled){background:rgba(255,255,255,.1);color:#fff;border-color:rgba(148,179,224,.45)}
.btn-sec:disabled{opacity:.35;cursor:not-allowed}
.btn-sec.pulse{border-color:rgba(245,158,11,.7);color:#fde68a;background:rgba(245,158,11,.14);animation:spotPulse 1.8s infinite}
.toast{
  flex:1;min-width:0;text-align:center;font-size:13.5px;font-weight:600;line-height:1.45;
  padding:7px 13px;border-radius:10px;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  animation:toastIn .2s var(--ease);
}
.toast.ok{color:#86efac;background:rgba(16,185,129,.13);border:1px solid rgba(16,185,129,.32)}
.toast.bad{color:#fda4af;background:rgba(244,63,94,.13);border:1px solid rgba(244,63,94,.32)}
.toast.warn{color:#fde68a;background:rgba(245,158,11,.13);border:1px solid rgba(245,158,11,.32)}
.toast.info{color:#7dd3fc;background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.24)}

/* ─── Recall & Summary View (inside Workspace) ──────────────────────────── */
.recall-wrap{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;animation:viewIn .24s var(--ease)}
.flashcard{
  width:min(680px,100%);padding:28px 26px;border-radius:18px;
  background:linear-gradient(180deg,rgba(24,36,62,.96),var(--surface-2));
  border:1px solid var(--border-hi);box-shadow:0 16px 40px rgba(0,0,0,.3),var(--spec);
  text-align:center;display:flex;flex-direction:column;gap:15px;
}
.flash-q{font-family:var(--display);font-size:18.5px;font-weight:700;line-height:1.55}
.flash-a{
  font-size:15px;color:#a7f3d0;padding:15px 18px;border-radius:12px;
  background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.32);line-height:1.75;
  animation:cardReveal .26s var(--ease);
}
.sum-list{list-style:none;margin:0;padding:0;width:min(760px,100%);display:flex;flex-direction:column;gap:9px}
.sum-list li{
  display:flex;align-items:flex-start;gap:11px;padding:13px 16px;border-radius:12px;
  background:linear-gradient(180deg,rgba(23,34,58,.95),var(--surface-2));
  border:1px solid var(--border);box-shadow:var(--spec);font-size:14.5px;line-height:1.7;
}
.sum-num{
  width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;
  background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent2);
  font-family:var(--display);font-size:13px;font-weight:700;margin-top:2px;
}

/* ─── Single Overlay Slot (Level Clear / QA) ────────────────────────────── */
.overlay{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:16px;background:rgba(4,8,18,.8);backdrop-filter:blur(8px)}
.overlay[hidden]{display:none}
.modal{
  width:min(500px,100%);max-height:90dvh;display:flex;flex-direction:column;gap:13px;
  padding:22px;border-radius:18px;
  background:linear-gradient(180deg,#14213b,#0e172a);
  border:1px solid var(--border-hi);box-shadow:0 28px 64px rgba(0,0,0,.6),var(--spec);
  animation:pop .24s var(--ease);
}
.modal h3{font-family:var(--display);margin:0;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:10px}
.modal-body{overflow:auto;display:flex;flex-direction:column;gap:10px;font-size:14.5px;line-height:1.7}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.celebrate-badge{display:grid;place-items:center;margin:4px auto 0;width:72px;height:72px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent2) 26%,transparent),transparent 70%);color:var(--accent2);animation:trophyFloat 1.8s ease-in-out infinite}
.celebrate-badge svg{width:46px;height:46px;filter:drop-shadow(0 4px 14px color-mix(in srgb,var(--accent) 45%,transparent))}
.big-stars{display:flex;justify-content:center;gap:8px}
.big-stars svg{width:32px;height:32px;color:#334155}
.big-stars svg.lit{color:#fbbf24;filter:drop-shadow(0 0 10px rgba(251,191,36,.45));animation:okPop .35s var(--ease)}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:250;overflow:hidden}
.cf{position:absolute;width:9px;height:9px;border-radius:2px;animation:fall .9s var(--ease) forwards}
.cf.dot{border-radius:50%;width:7px;height:7px}

@keyframes viewIn{0%{opacity:0;transform:translateY(7px)}100%{opacity:1;transform:translateY(0)}}
@keyframes toastIn{0%{opacity:0;transform:translateY(4px)}100%{opacity:1;transform:translateY(0)}}
@keyframes cardReveal{0%{opacity:0;transform:translateY(6px) scale(.98)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes okPop{0%{transform:scale(1)}45%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes chipSnap{0%{transform:scale(.88)}65%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes xpBump{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes spotPulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 34%,transparent)}50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 0%,transparent)}}
@keyframes trophyFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(145px) rotate(260deg);opacity:0}}
@keyframes pop{0%{transform:scale(.95);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ─── Responsive Breakpoints (Balanced on Every Screen, Never Narrow!) ──── */
@media (max-width:1120px){
  .doc-grid{display:flex;flex-direction:column;gap:12px;padding:14px}
  .doc-col{flex-shrink:0;min-height:auto}
}
@media (max-width:959px){
  .studio{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);gap:8px;padding:8px}
  .rail-head,.rail-foot{display:none}
  .rail-list{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:6px;gap:6px;scrollbar-width:none}
  .rail-list::-webkit-scrollbar{display:none}
  .sec-tab{width:auto;padding:7px 11px;gap:7px}
  .sec-tab::before{inset-block:auto;bottom:0;inset-inline:10px;width:auto;height:2.5px}
  .sec-meta{display:none}
  .sec-num{width:24px;height:24px;font-size:11px}
  .sec-title{font-size:12.5px}
  .patch-grid{grid-template-columns:1fr}
}
@media (max-width:600px){
  .topbar{padding:0 10px;gap:6px}
  .brand-sub,.prog-ring-chip,.top-lbl{display:none}
  .ws-header{padding:9px 12px;gap:8px}
  .ws-en,.ws-deco{display:none}
  .sub-bar{padding:6px 12px}
  .sub-bar > span{display:none}
  .doc-grid{padding:10px 12px;gap:10px}
  .doc-card{padding:13px 14px}
  .doc-card h2{font-size:16px}
  .doc-p{font-size:14px;line-height:1.72}
  .game-shell{padding:10px 12px}
  .playfield{padding:12px}
  .ws-dock{padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:6px}
  .ws-dock .toast.info{display:none}
  .btn-primary{padding:0 12px;font-size:12.5px;min-height:38px}
  .btn-sec{padding:0 10px;font-size:12.5px;min-height:38px}
  .dock-lbl{display:none}
  .match-grid{gap:8px}
  .m-btn{padding:8px;font-size:13px}
}
@media (max-height:480px){
  .app{grid-template-rows:44px minmax(0,1fr)}
  .studio{padding:6px;gap:6px}
  .ws-header{padding:6px 14px}
  .ws-heading h1{font-size:15.5px}
  .mode-btn{min-height:30px;padding:0 11px;font-size:12.5px}
  .sub-bar{padding:5px 14px}
  .sub-pill{min-height:28px;font-size:12px;padding:0 10px}
  .doc-grid{padding:10px 14px;gap:10px}
  .doc-card{padding:11px 14px;gap:7px}
  .doc-card h2{font-size:15.5px}
  .doc-p{font-size:13.5px;line-height:1.6}
  .callout{padding:8px 11px;font-size:13px;line-height:1.55}
  .code-pre{padding:9px 12px;font-size:12.5px;line-height:1.55}
  .game-shell{padding:8px 14px}
  .mission-card{padding:9px 14px}
  .mission-card h2{font-size:14.5px}
  .playfield{padding:10px 14px;gap:10px}
  .ws-dock{padding:6px 14px}
  .btn-primary,.btn-sec{min-height:34px;font-size:12.5px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

  const out = arr.map((v,i)=>({v,i}));
  let h = 2166136261;
  for(const c of String(seed)) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  for(let i=out.length-1;i>0;i--){
    h = Math.imul(h ^ (h>>>13), 1274126177);
    const j = Math.abs(h) % (i+1);
    [out[i],out[j]] = [out[j],out[i]];
  }
  if(out.length > 1 && out.every((x,i)=>x.i===i)) [out[0],out[1]] = [out[1],out[0]];
  return out;
}

/* ─── Pointer-Events Drag Helper (Nested-Button Safe!) ──────────────────── */
function attachDrag(el, { onTap, onDrop }){
  let sx=0, sy=0, dragging=false, ghost=null, lastDrop=null, pid=null;
  el.addEventListener('pointerdown', e => {
    if(e.button && e.button !== 0) return;
    if(e.target.closest('.mv-btn')) return;
    if(el.classList.contains('used') || el.classList.contains('locked')) return;
    pid = e.pointerId; sx = e.clientX; sy = e.clientY; dragging = false;
  });
  el.addEventListener('pointermove', e => {
    if(pid !== e.pointerId) return;
    if(!dragging && Math.hypot(e.clientX-sx, e.clientY-sy) > 7){
      dragging = true;
      try{ el.setPointerCapture(pid); }catch{}
      ghost = el.cloneNode(true); ghost.classList.add('drag-ghost');
      ghost.style.width = el.offsetWidth + 'px';
      document.body.appendChild(ghost);
    }
    if(dragging && ghost){
      ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px';
      const u = document.elementFromPoint(e.clientX, e.clientY);
      const dz = u && u.closest('[data-drop]');
      if(lastDrop && lastDrop !== dz) lastDrop.classList.remove('drop-over');
      if(dz) dz.classList.add('drop-over');
      lastDrop = dz;
    }
  });
  const end = e => {
    if(pid !== e.pointerId) return;
    pid = null;
    if(ghost){ ghost.remove(); ghost = null; }
    if(lastDrop) lastDrop.classList.remove('drop-over');
    if(dragging){ const dz = lastDrop; lastDrop = null; if(dz && onDrop) onDrop(dz); }
    else if(onTap) onTap();
    dragging = false;
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

/* ─── EXPLAIN MODE: Rich Structured Teaching + Visual Lab ───────────────── */
function renderExplainMode(L){

  $sub.innerHTML = `

    <article class="doc-card">

      <div class="win-frame">
        <div class="win-bar">
          <div class="win-dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>

        <div class="console-body">${d.console.map(l => `<div class="console-line"><span>${esc(l)}</span></div>`).join('')}</div>

/* ─── Scoring, Miss Handling & Section Completion ───────────────────────── */
function onMiss(whyMsg, st){
  stageMisses++; levelMisses++;
  S.streak = 0; Store.save(S);
  const L = LESSON.levels[curL];
  if(L.boss){
    hearts = Math.max(0, hearts - 1);
    renderChrome();
    const hb = $ws.querySelectorAll('.hearts-bar');
    hb.forEach(x => x.innerHTML = renderHeartsHtml(hearts));
    if(hearts === 0){
      openModal('خلصت القلوب!', `<p>عاش إنك وصلت لحد هنا — هنرجع نبدأ التحدي والتلميحات مفتوحة ليك مجاناً.</p>`,
        `<button class="btn-primary" id="bossRetry">جرّب تاني</button>`);
      document.getElementById('bossRetry').onclick = () => { closeModal(); hearts=3; curS=0; renderPlayMode(L, true); };
      return;
    }
  }
  if(whyMsg && !levelMistakes.includes(whyMsg)) levelMistakes.push(whyMsg);
  if(stageMisses >= 3 && revealHandler){
    toast(`${say('reveal')} ${whyMsg || ''}`, 'warn');
    revealHandler();
    markSolved({ xpOverride:0, revealed:true });
    return;
  }
  toast(`${say('wrong')}${whyMsg || ''}`, 'bad');
  const hbBtn = document.getElementById('hintBtn');
  if(hbBtn && st.hint){
    hbBtn.classList.add('pulse');
    if(stageMisses === 2 && !stageHintUsed){ stageHintUsed = true; toast(`${say('hint')}${st.hint}`, 'warn'); }
  }
  renderChrome();
}

function markSolved({ xpOverride, revealed=false, msg } = {}){
  if(stageSolved) return;
  stageSolved = true;
  const L = LESSON.levels[curL];
  const st = L.stages[curS];
  const firstClear = !S.solved[st.id];
  S.solved[st.id] = true;

  let gained = xpOverride !== undefined ? xpOverride : (stageMisses===0 ? 10 : stageMisses===1 ? 6 : 3);
  if(!firstClear) gained = Math.min(gained, 2);
  if(!revealed && stageHintUsed && gained > 0) gained = Math.max(0, gained - 2);
  let comboMsg = '';
  if(!revealed && stageMisses === 0 && xpOverride === undefined){
    S.streak = (S.streak || 0) + 1;
    if(S.streak >= 3){ gained *= 2; comboMsg = ' · ' + say('combo'); }
  }
  S.xp += gained; levelXP += gained;
  if(gained > 0) bumpXpNext = true;

  if(sectionSolvedCount(L) === L.stages.length){
    const stars = levelMisses === 0 ? 3 : levelMisses <= 2 ? 2 : 1;
    const prev = S.levels[L.id]?.stars || 0;
    S.levels[L.id] = { done:true, stars:Math.max(prev, stars) };
  }
  Store.save(S);
  if(!revealed) toast(`${msg || say('ok')} (+${gained} XP)${comboMsg}`, 'ok');
  renderChrome();

  const curPill = $ws.querySelector(`.sub-pill[data-si="${curS}"]`);
  if(curPill){ curPill.classList.add('solved'); curPill.innerHTML = `${ico('check','ic-sm')}<span>تحدي ${ar(curS+1)}</span>`; }

  const pb = document.getElementById('primaryBtn');
  if(pb){
    pb.disabled = false;
    const isLast = curS >= L.stages.length - 1;
    pb.innerHTML = isLast ? `${ico('trophy','ic-sm')} خلصت القسم` : `التحدي اللي بعده`;
    pb.onclick = goNextChallenge;
  }
}

function goNextChallenge(){
  const L = LESSON.levels[curL];
  if(curS < L.stages.length - 1){
    curS++;
    renderPlayMode(L);
  } else {
    confetti();
    const stars = S.levels[L.id]?.stars || 3;
    const hasNext = curL < LESSON.levels.length - 1;
    const nextL = hasNext ? LESSON.levels[curL + 1] : null;
    openModal(
      `${say('levelDone')}`,
      `<div class="celebrate-badge">${ico('trophy')}</div>
       <div class="big-stars">${[1,2,3].map(n=>`<svg class="${n<=stars?'lit':''}" aria-hidden="true"><use href="#i-star"/></svg>`).join('')}</div>
       <div style="text-align:center;color:#fde68a;font-family:var(--display);font-weight:700">+${levelXP} XP · إجمالي ${S.xp} XP</div>
       ${levelMistakes.length ? `<div class="callout warn"><span class="callout-ico">${ico('warn','ic-sm')}</span><div><strong>افتكر دايماً:</strong> ${esc(levelMistakes[0])}</div></div>` : `<div class="callout tip"><span class="callout-ico">${ico('tip','ic-sm')}</span><div>ولا غلطة! أداء نضيف ١٠٠٪</div></div>`}`,
      `<button class="btn-sec" id="mStay">أراجع القسم</button>
       <button class="btn-primary" id="mNext">${hasNext ? `القسم الجاي: ${esc(nextL.title)}` : 'بطاقات المراجعة والملخص'}</button>`
    );
    document.getElementById('mStay').onclick = closeModal;
    document.getElementById('mNext').onclick = () => {
      closeModal();
      if(hasNext) selectSection(curL + 1);
      else { view = 'recall'; renderAll(); }
    };
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   THE 8 ZERO-OVERLAP INTERACTIVE MECHANICS
   ═══════════════════════════════════════════════════════════════════════════ */
const MECHANICS = {
  explore(st, root, pb){
    const seen = new Set(); const total = st.spots.length;
    const codeHtml = renderMarked(st.code, st.lang, (id, txt) => `<button type="button" class="spot" data-si="${id}">${esc(txt)}</button>`);
    root.innerHTML = `
      <div class="win-frame">
        <div class="win-bar"><div class="win-dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div><span class="win-title" id="expCnt">اضغط الأجزاء المنوّرة (${ar(0)}/${ar(total)})</span></div>
        <pre class="code-pre"><code>${codeHtml}</code></pre>
      </div>
      <div class="spot-readout" id="spotCard">${ico('xray','ic-sm')}<span>اضغط على كل جزء منوّر في الكود عشان تشوف بيعمل إيه</span></div>`;
    pb.disabled = true; pb.textContent = `استكشف (${ar(0)}/${ar(total)})`;
    root.querySelectorAll('.spot').forEach(btn => {
      btn.onclick = () => {
        const idx = +btn.dataset.si, sp = st.spots[idx];
        root.querySelectorAll('.spot.active').forEach(b=>b.classList.remove('active'));
        btn.classList.add('seen','active'); seen.add(idx);
        document.getElementById('spotCard').innerHTML = `${ico('xray','ic-sm')}<div><strong>${esc(sp.title)}:</strong> ${esc(sp.say)}</div>`;
        const ec = document.getElementById('expCnt');
        if(ec) ec.textContent = `اضغط الأجزاء المنوّرة (${ar(seen.size)}/${ar(total)})`;
        if(seen.size >= total) markSolved({ xpOverride:5, msg:'عاش! استكشفت الكود كله!' });
        else pb.textContent = `استكشف (${ar(seen.size)}/${ar(total)})`;
      };
    });
  },

  choice(st, root, pb){
    pb.disabled = true; pb.textContent = 'اختار الإجابة';
    root.innerHTML = `
      ${st.code ? `<div class="win-frame"><div class="win-bar"><div class="win-dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div><span class="win-title">${esc(st.lang || LESSON.lang || 'code')}</span></div><pre class="code-pre"><code>${hl(st.code, st.lang)}</code></pre></div>` : ''}
      <div class="opt-grid" role="radiogroup">
        ${st.options.map((o,i) => `
          <button type="button" class="opt-btn" data-oi="${i}">
            <div class="opt-row"><span class="opt-k">${ar(i+1)}</span><span ${looksCode(o.t||'')?'class="ltr" style="font-family:var(--mono);font-size:13.5px"':''}>${esc(o.t || `النتيجة ${ar(i+1)}`)}</span></div>
            ${o.preview ? `<div class="browser-frame"><div class="browser-bar"><div class="win-dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div></div><div class="browser-body">${o.preview}</div></div>` : ''}
          </button>`).join('')}
      </div>`;
    revealHandler = () => root.querySelectorAll('.opt-btn').forEach((b,i)=>{ b.disabled=true; if(i===st.answer) b.classList.add('ok'); });
    root.querySelectorAll('.opt-btn').forEach(btn => {
      btn.onclick = () => {
        if(stageSolved) return;
        const idx = +btn.dataset.oi, opt = st.options[idx];
        if(idx === st.answer){
          btn.classList.add('ok'); root.querySelectorAll('.opt-btn').forEach(b=>b.disabled=true);
          markSolved({ msg: opt.why || say('ok') });
        } else {
          btn.classList.add('bad'); btn.disabled = true;
          onMiss(opt.why || st.options[st.answer].why, st);
        }
      };
    });
  },

  slot(st, root, pb){
    const filled = Array(st.answer.length).fill(null);
    let picked = null;
    const toks = shuffled(st.tokens, st.id);
    const codeHtml = renderMarked(st.code, st.lang, id => `<button type="button" class="slot-blank" data-drop="slot" data-si="${id}">___</button>`);
    root.innerHTML = `
      <div class="win-frame"><div class="win-bar"><div class="win-dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div><span class="win-title">اسحب القطع أو اضغط للتركيب</span></div><pre class="code-pre"><code>${codeHtml}</code></pre></div>
      <div class="tray" id="tokTray">${toks.map((t,ti)=>`<button type="button" class="chip code-chip" data-ti="${ti}">${esc(t.v)}</button>`).join('')}</div>`;
    const slotEls = [...root.querySelectorAll('.slot-blank')];
    const chipEls = [...root.querySelectorAll('.chip')];
    function sync(){
      slotEls.forEach((s,i)=>{ const ti=filled[i]; s.textContent = ti===null?'___':toks[ti].v; s.classList.toggle('filled',ti!==null); s.classList.remove('ok','bad'); });
      chipEls.forEach((c,ti)=>{ c.classList.toggle('used', filled.includes(ti)); c.classList.toggle('picked', picked===ti); });
      pb.disabled = filled.some(x=>x===null);
    }
    function place(ti, si){
      if(stageSolved) return;
      const old = filled.indexOf(ti); if(old!==-1) filled[old]=null;
      filled[si] = ti; picked = null; sync();
    }
    chipEls.forEach((c,ti)=>attachDrag(c, { onTap(){ picked=(picked===ti?null:ti); sync(); }, onDrop(dz){ if(dz.dataset.drop==='slot') place(ti, +dz.dataset.si); } }));
    slotEls.forEach((s,si)=> s.onclick = () => { if(stageSolved) return; if(picked!==null) place(picked, si); else if(filled[si]!==null){ filled[si]=null; sync(); } });
    revealHandler = () => { slotEls.forEach((s,i)=>{ s.textContent=st.answer[i]; s.classList.add('filled','ok'); }); chipEls.forEach(c=>c.classList.add('used')); };
    checkHandler = () => {
      if(stageSolved || filled.some(x=>x===null)) return;
      let ok = true;
      slotEls.forEach((s,i)=>{ const r = toks[filled[i]].v === st.answer[i]; s.classList.toggle('ok',r); s.classList.toggle('bad',!r); if(!r) ok=false; });
      if(ok) markSolved({ msg: st.why || say('ok') }); else onMiss(st.why || 'في خانة لسه مش مظبوطة — راجع الحمرا!', st);
    };
    pb.onclick = checkHandler; sync();
  },

  buckets(st, root, pb){
    pb.disabled = true; pb.textContent = 'اسحب أو اضغط كل عنصر لمكانه';
    const items = shuffled(st.items, st.id);
    const placed = new Set(); let picked = null;
    const isWire = st.layout === 'wireframe';
    const isTable = isWire && st.buckets.every(b=>['caption','thead','tbody','tfoot'].includes(b.area));
    const cls = isWire ? (isTable ? 'wireframe-table' : 'wireframe-page') : 'buckets-grid';
    root.innerHTML = `
      <div class="${cls}">${st.buckets.map(b=>`<div class="bucket" data-drop="bucket" data-bid="${esc(b.id)}" ${b.area&&!isTable?`style="grid-area:${esc(b.area)}"`:''}><div class="bucket-h">${esc(b.label)}</div><div class="bucket-items" data-bi="${esc(b.id)}"></div></div>`).join('')}</div>
      <div class="tray" id="bTray">${items.map((it,idx)=>`<button type="button" class="chip ${looksCode(it.v.t)?'code-chip':''}" data-ii="${idx}">${esc(it.v.t)}</button>`).join('')}</div>`;
    const chips = [...root.querySelectorAll('#bTray .chip')];
    const bkts = [...root.querySelectorAll('.bucket')];
    function tryDrop(idx, bid){
      if(stageSolved || placed.has(idx)) return;
      const item = items[idx].v, chip = chips[idx];
      picked = null; chips.forEach(c=>c.classList.remove('picked')); bkts.forEach(b=>b.classList.remove('hint-glow'));
      if(item.b === bid){
        placed.add(idx); chip.classList.add('locked');
        root.querySelector(`[data-bi="${CSS.escape(bid)}"]`).appendChild(chip);
        toast(item.why || say('ok'), 'ok');
        if(placed.size === items.length) markSolved();
      } else {
        chip.classList.remove('bad'); void chip.offsetWidth; chip.classList.add('bad');
        onMiss(item.why || 'جرّب خانة تانية!', st);
        if(stageMisses >= 2) root.querySelector(`[data-bid="${CSS.escape(item.b)}"]`)?.classList.add('hint-glow');
      }
    }
    chips.forEach((c,idx)=>attachDrag(c, { onTap(){ if(placed.has(idx)) return; picked=(picked===idx?null:idx); chips.forEach((x,i)=>x.classList.toggle('picked',i===picked)); }, onDrop(dz){ if(dz.dataset.drop==='bucket') tryDrop(idx, dz.dataset.bid); } }));
    bkts.forEach(b=> b.onclick = () => { if(picked !== null) tryDrop(picked, b.dataset.bid); });
    revealHandler = () => items.forEach((it,idx)=>{ if(!placed.has(idx)){ placed.add(idx); chips[idx].classList.add('locked'); root.querySelector(`[data-bi="${CSS.escape(it.v.b)}"]`).appendChild(chips[idx]); } });
  },

  order(st, root, pb){
    let arr = shuffled(st.items, st.id);
    const isCode = !!st.mono || st.items.every(x => looksCode(x));
    function draw(){
      root.innerHTML = `<div class="order-list">${arr.map((it,pos)=>`
        <div class="order-row" data-drop="order" data-pos="${pos}">
          <span class="order-idx">${ar(pos+1)}</span>
          <span class="order-txt ${isCode?'mono':''}">${esc(it.v)}</span>
          <div class="mv-btns">
            <button type="button" class="mv-btn" data-up="${pos}" aria-label="أعلى" ${pos===0?'disabled':''}>▲</button>
            <button type="button" class="mv-btn" data-dn="${pos}" aria-label="أسفل" ${pos===arr.length-1?'disabled':''}>▼</button>
          </div>
        </div>`).join('')}</div>`;
      root.querySelectorAll('[data-up]').forEach(b=> b.onclick = e => { e.stopPropagation(); swap(+b.dataset.up, +b.dataset.up-1); });
      root.querySelectorAll('[data-dn]').forEach(b=> b.onclick = e => { e.stopPropagation(); swap(+b.dataset.dn, +b.dataset.dn+1); });
      root.querySelectorAll('.order-row').forEach(r=> attachDrag(r, {
        onDrop(dz){ if(dz.dataset.drop==='order'){ const f=+r.dataset.pos, t=+dz.dataset.pos; if(f!==t){ const [m]=arr.splice(f,1); arr.splice(t,0,m); draw(); } } }
      }));
    }
    function swap(a,b){ if(stageSolved) return; [arr[a],arr[b]]=[arr[b],arr[a]]; draw(); }
    revealHandler = () => { arr = st.items.map((v,i)=>({v,i})); draw(); root.querySelectorAll('.order-row').forEach(r=>r.classList.add('ok')); };
    checkHandler = () => {
      if(stageSolved) return;
      let ok = true;
      root.querySelectorAll('.order-row').forEach((r,pos)=>{ const rt = arr[pos].i===pos; r.classList.toggle('ok',rt); r.classList.toggle('bad',!rt); if(!rt) ok=false; });
      if(ok) markSolved({ msg: st.why || say('ok') }); else onMiss(st.why || 'السطور الحمرا مش في ترتيبها الصح!', st);
    };
    pb.disabled = false; pb.onclick = checkHandler; draw();
  },

  bughunt(st, root, pb){
    const found = new Set(), total = st.bugs.length;
    pb.disabled = true; pb.textContent = `اصطدت ${ar(0)}/${ar(total)}`;
    const codeHtml = renderMarked(st.code, st.lang, (id, txt) => `<button type="button" class="bug-tok" data-bk="${id}">${hl(txt, st.lang)}</button>`);
    root.innerHTML = `
      <div class="win-frame"><div class="win-bar"><div class="win-dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div><span class="win-title">اضغط على الغلطة جوا الكود</span></div><pre class="code-pre"><code>${codeHtml}</code></pre></div>
      <div class="spot-readout" id="bugCard" hidden></div>`;
    revealHandler = () => {
      root.querySelectorAll('.bug-tok').forEach(b=>{ if(b.dataset.bk!=='ok') b.classList.add('found'); });
      const bc = document.getElementById('bugCard'); bc.hidden=false; bc.innerHTML=`${ico('target','ic-sm')}<div><strong>الغلطة:</strong> ${esc(st.bugs.map(x=>x.why).join(' · '))}</div>`;
    };
    root.querySelectorAll('.bug-tok').forEach(btn => {
      btn.onclick = () => {
        if(stageSolved) return;
        const k = btn.dataset.bk;
        if(k === 'ok'){ btn.classList.remove('safe-hit'); void btn.offsetWidth; btn.classList.add('safe-hit'); onMiss(say('okSpot'), st); }
        else {
          const bi = +k; if(found.has(bi)) return;
          found.add(bi); btn.classList.add('found');
          const bc = document.getElementById('bugCard'); bc.hidden=false; bc.innerHTML=`${ico('target','ic-sm')}<div><strong>صِدتَها!</strong> ${esc(st.bugs[bi].why)}</div>`;
          if(found.size >= total) markSolved({ msg: st.bugs[bi].why });
          else { pb.textContent = `اصطدت ${ar(found.size)}/${ar(total)}`; toast(st.bugs[bi].why, 'ok'); }
        }
      };
    });
  },

  match(st, root, pb){
    pb.disabled = true; pb.textContent = `وصّل ${ar(st.pairs.length)} أزواج`;
    const lefts = st.pairs.map((p,i)=>({v:p[0],i}));
    const rights = shuffled(st.pairs.map(p=>p[1]), st.id);
    const done = new Set(); let pL = null, pR = null;
    root.innerHTML = `<div class="match-grid">
      <div class="match-col">${lefts.map(x=>`<button type="button" class="m-btn ${looksCode(x.v)?'mono-m':''}" data-ml="${x.i}">${esc(x.v)}</button>`).join('')}</div>
      <div class="match-col">${rights.map(x=>`<button type="button" class="m-btn ${looksCode(x.v)?'mono-m':''}" data-mr="${x.i}">${esc(x.v)}</button>`).join('')}</div>
    </div>`;
    const lBtns = [...root.querySelectorAll('[data-ml]')], rBtns = [...root.querySelectorAll('[data-mr]')];
    function chk(){
      if(pL===null || pR===null) return;
      const lb = root.querySelector(`[data-ml="${pL}"]`), rb = root.querySelector(`[data-mr="${pR}"]`);
      if(pL === pR){
        done.add(pL); lb.classList.remove('picked','hint-glow'); rb.classList.remove('picked','hint-glow');
        lb.classList.add('ok'); rb.classList.add('ok'); lb.disabled=rb.disabled=true; pL=pR=null;
        if(done.size === st.pairs.length) markSolved();
        else toast(`${say('ok')} (${ar(done.size)}/${ar(st.pairs.length)})`, 'ok');
      } else {
        lb.classList.add('bad'); rb.classList.add('bad'); const curPL = pL;
        setTimeout(()=>{ lb.classList.remove('bad','picked'); rb.classList.remove('bad','picked'); }, 320);
        pL=pR=null; onMiss('التوصيلة دي مش مظبوطة — فكّر في معنى المصطلح وجرّب تاني!', st);
        if(stageMisses >= 2){ root.querySelector(`[data-ml="${curPL}"]`)?.classList.add('hint-glow'); root.querySelector(`[data-mr="${curPL}"]`)?.classList.add('hint-glow'); }
      }
    }
    lBtns.forEach(b=> b.onclick = () => { if(stageSolved||b.disabled) return; lBtns.forEach(x=>x.classList.remove('picked')); pL=+b.dataset.ml; b.classList.add('picked'); chk(); });
    rBtns.forEach(b=> b.onclick = () => { if(stageSolved||b.disabled) return; rBtns.forEach(x=>x.classList.remove('picked')); pR=+b.dataset.mr; b.classList.add('picked'); chk(); });
    revealHandler = () => { lBtns.forEach(b=>{ b.classList.add('ok'); b.disabled=true; }); rBtns.forEach(b=>{ b.classList.add('ok'); b.disabled=true; }); };
  },

  patch(st, root, pb){
    const chipsHtml = (st.chips||[]).map(c=>`<button type="button" class="ins-chip" data-ins="${esc(c)}">+ ${esc(c)}</button>`).join('');
    const isCodeCheckOnly = (st.lang || LESSON.lang) === 'js' && !st.previewHtml;
    root.innerHTML = `<div class="patch-grid">
      <div class="patch-ed">
        <div class="chip-bar">${chipsHtml}<button type="button" class="top-btn" id="pReset">${ico('reset','ic-sm')} رجّع الكود</button></div>
        <textarea class="patch-ta" id="pTa" spellcheck="false" aria-label="محرر الكود">${esc(st.start)}</textarea>
      </div>
      ${isCodeCheckOnly ? `
        <div class="patch-checks">
          <div class="win-bar"><div class="win-dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div><span class="win-title">فحص الكود المباشر</span></div>
          <div class="patch-check-list" id="pChecklist"></div>
        </div>` : `
        <div class="patch-prev">
          <div class="browser-bar"><div class="win-dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div><div class="browser-url">${ico('eye','ic-sm')} معاينة حية</div></div>
          <iframe id="pFrame" sandbox="" title="معاينة حية"></iframe>
        </div>`}
    </div>`;
    const ta = document.getElementById('pTa');
    const fr = document.getElementById('pFrame');
    const cl = document.getElementById('pChecklist');
    let tm = null;
    const evalCheck = (c, val, doc) => {
      if(c.selector && !doc.querySelector(c.selector)) return false;
      if(c.notSelector && doc.querySelector(c.notSelector)) return false;
      if(c.regex && !(new RegExp(c.regex, c.flags||'i').test(val))) return false;
      if(c.notRegex && (new RegExp(c.notRegex, c.flags||'i').test(val))) return false;
      return true;
    };
    const upd = () => {
      const val = ta.value;
      if(fr){
        const bodyContent = st.previewHtml ? `<style>${val}</style>${st.previewHtml}` : val;
        fr.srcdoc = `<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><style>body{font-family:system-ui,sans-serif;padding:12px;margin:0;color:#0f172a;font-size:14px}img{max-width:100%}a{color:#2563eb}</style></head><body>${bodyContent}</body></html>`;
      }
      if(cl){
        const doc = new DOMParser().parseFromString(val, 'text/html');
        cl.innerHTML = st.checks.map((c, idx) => {
          const ok = evalCheck(c, val.trim(), doc);
          return `<div class="pchk ${ok?'pass':''}">${ok ? ico('check','ic-sm') : ico('target','ic-sm')}<span>شرط ${ar(idx+1)}: ${esc(c.label || c.fail)}</span></div>`;
        }).join('');
      }
    };
    upd();
    ta.addEventListener('input', () => { clearTimeout(tm); tm = setTimeout(upd, 180); });
    ta.addEventListener('keydown', e => {
      if(e.key==='Tab'){ e.preventDefault(); const s=ta.selectionStart,en=ta.selectionEnd; ta.value=ta.value.slice(0,s)+'  '+ta.value.slice(en); ta.selectionStart=ta.selectionEnd=s+2; }
    });
    root.querySelectorAll('[data-ins]').forEach(btn => btn.onclick = () => {
      const ins = btn.dataset.ins, pos = ta.selectionStart ?? ta.value.length;
      const b = ta.value.slice(0,pos), a = ta.value.slice(ta.selectionEnd ?? pos);
      const pad = b.length && !/\s$/.test(b) && !b.endsWith('<') ? ' ' : '';
      ta.value = b + pad + ins + a; ta.focus(); ta.selectionStart = ta.selectionEnd = (b+pad+ins).length; upd();
    });
    document.getElementById('pReset').onclick = () => { ta.value = st.start; upd(); ta.focus(); };
    revealHandler = () => { if(st.solution){ ta.value = st.solution; upd(); } };
    checkHandler = () => {
      if(stageSolved) return;
      const val = ta.value.trim(), doc = new DOMParser().parseFromString(val, 'text/html');
      for(const c of st.checks){
        if(!evalCheck(c, val, doc)) return onMiss(c.fail, st);
      }
      markSolved({ msg: st.why || 'كودك شغال ١٠٠٪!' });
    };
    pb.disabled = false; pb.onclick = checkHandler;
  }
};

/* ─── Recall Flashcards & Summary Views ─────────────────────────────────── */
function renderRecallView(){
  checkHandler = revealHandler = null;
  if(!recallQ.length && LESSON.recall?.length){
    recallQ = LESSON.recall.map((r,i)=>({...r, id:i, retried:false}));
    recallIdx = 0; recallFlipped = false;
  }
  const finished = recallIdx >= recallQ.length;
  const card = recallQ[recallIdx];
  $ws.innerHTML = `
    <div class="ws-header">
      <svg class="ws-deco" aria-hidden="true"><use href="#i-deco-grid"/></svg>
      <div class="ws-heading"><span class="ws-badge">${ico('cards','ic-sm')} بطاقات المراجعة السريعة</span><h1>ثبّت أهم أفكار المحاضرة</h1></div>
    </div>
    <div class="recall-wrap scroll">
      ${finished ? `<div class="flashcard"><div class="celebrate-badge">${ico('trophy')}</div><div class="flash-q">خلّصت كل بطاقات المراجعة!</div><div><button class="btn-sec" id="recRestart">${ico('reset','ic-sm')} راجع من الأول</button></div></div>` : `
        <div class="flashcard">
          <div style="font-family:var(--display);font-size:12.5px;color:var(--muted);font-weight:600">بطاقة ${ar(recallIdx+1)} من ${ar(recallQ.length)}</div>
          <div class="flash-q">${esc(card.q)}</div>
          ${recallFlipped
            ? `<div class="flash-a">${esc(card.a)}</div><div style="display:flex;gap:10px;justify-content:center"><button class="btn-primary" id="recOk">${ico('check','ic-sm')} عرفتها</button><button class="btn-sec" id="recNo">${ico('reset','ic-sm')} لسه شوية</button></div>`
            : `<div><button class="btn-primary" id="recFlip">${ico('eye','ic-sm')} ورّيني الإجابة</button></div>`}
        </div>`}
    </div>
    <footer class="ws-dock">
      <button class="btn-sec" id="backSec">ارجع للأقسام</button>
      <div class="toast info">اضغط على أي قسم على اليمين في أي وقت</div>
      <button class="btn-primary" id="goSum">${ico('summary','ic-sm')} ملخص التسليم في CodeHub</button>
    </footer>`;
  const fl = document.getElementById('recFlip'); if(fl) fl.onclick = () => { recallFlipped=true; renderRecallView(); };
  const ok = document.getElementById('recOk'); if(ok) ok.onclick = () => { recallIdx++; recallFlipped=false; renderRecallView(); };
  const no = document.getElementById('recNo'); if(no) no.onclick = () => { if(!card.retried) recallQ.push({...card, retried:true}); recallIdx++; recallFlipped=false; renderRecallView(); };
  const rs = document.getElementById('recRestart'); if(rs) rs.onclick = () => { recallQ=[]; renderRecallView(); };
  document.getElementById('backSec').onclick = () => { view='section'; renderAll(); };
  document.getElementById('goSum').onclick = () => { view='summary'; renderAll(); };
}

function renderSummaryView(){
  checkHandler = revealHandler = null;
  $ws.innerHTML = `
    <div class="ws-header">
      <svg class="ws-deco" aria-hidden="true"><use href="#i-deco-grid"/></svg>
      <div class="ws-heading"><span class="ws-badge">${ico('summary','ic-sm')} ملخص التسليم</span><h1>نقط مهمة تكتبها في «تقديم الحل» تحت</h1></div>
    </div>
    <div class="recall-wrap scroll" style="justify-content:flex-start">
      <div class="callout tip" style="width:min(760px,100%)"><span class="callout-ico">${ico('check','ic-sm')}</span><div><strong>إزاي تقفّل المهمة في CodeHub:</strong> افتح لوحة «تقديم الحل» تحت الشاشة واكتب ملخصك بأسلوبك مغطي النقط دي:</div></div>
      <ul class="sum-list">${(LESSON.summary||[]).map((s,i)=>`<li><span class="sum-num">${ar(i+1)}</span><span>${esc(s)}</span></li>`).join('')}</ul>
    </div>
    <footer class="ws-dock">
      <button class="btn-sec" id="backSec">ارجع للأقسام</button>
      <div class="toast ok">إجمالي نقطك لحد دلوقتي: ${S.xp} XP</div>
      <button class="btn-primary" id="goRec">${ico('cards','ic-sm')} بطاقات المراجعة</button>
    </footer>`;
  document.getElementById('backSec').onclick = () => { view='section'; renderAll(); };
  document.getElementById('goRec').onclick = () => { view='recall'; renderAll(); };
}

/* ─── Input-Safe Global Keyboard Navigation ─────────────────────────────── */
window.addEventListener('keydown', e => {
  const tag = document.activeElement?.tagName;
  if(tag === 'INPUT' || tag === 'TEXTAREA') return;
  if(e.key === 'Escape' && !$overlay.hidden){ e.preventDefault(); closeModal(); return; }
  if(!$overlay.hidden || view !== 'section' || mode !== 'play') return;
  if(e.key === 'Enter'){ const pb=document.getElementById('primaryBtn'); if(pb&&!pb.disabled){ e.preventDefault(); pb.click(); } }
  else if(e.key.toLowerCase()==='h'){ const hb=document.getElementById('hintBtn'); if(hb&&!hb.disabled){ e.preventDefault(); hb.click(); } }
  else if(/^[1-4]$/.test(e.key)){ const b=$ws.querySelector(`.opt-btn[data-oi="${+e.key-1}"]`); if(b&&!b.disabled){ e.preventDefault(); b.click(); } }
});

/* ─── Built-in QA Self-Audit (?qa=1 & window.__LG_QA) ───────────────────── */
function runQA(){
  const rows = [];
  LESSON.levels.forEach((L, li) => {
    if(L.docs?.length){
      L.docs.forEach((d, di) => {
        view='section'; curL=li; mode='explain'; curDoc=di; renderAll();
        rows.push({ id:`${L.id}:doc${di}`, type:'explain', docY:Math.max(0,document.documentElement.scrollHeight-innerHeight), docX:Math.max(0,document.documentElement.scrollWidth-innerWidth) });
      });
    }
    L.stages.forEach((st, si) => {
      view='section'; curL=li; mode='play'; curS=si; renderAll();
      rows.push({ id:st.id, type:st.type, docY:Math.max(0,document.documentElement.scrollHeight-innerHeight), docX:Math.max(0,document.documentElement.scrollWidth-innerWidth) });
    });
  });
  view='recall'; renderAll();
  rows.push({ id:'RECALL', type:'recall', docY:Math.max(0,document.documentElement.scrollHeight-innerHeight), docX:Math.max(0,document.documentElement.scrollWidth-innerWidth) });
  view='summary'; renderAll();
  rows.push({ id:'SUMMARY', type:'summary', docY:Math.max(0,document.documentElement.scrollHeight-innerHeight), docX:Math.max(0,document.documentElement.scrollWidth-innerWidth) });
  selectSection(0, 'explain');
  window.__LG_QA_RESULT = { viewport:`${innerWidth}x${innerHeight}`, rows };
  return window.__LG_QA_RESULT;
}
window.__LG_QA = runQA;

/* ─── Boot: Open First Section Directly in Explain Mode! ────────────────── */
selectSection(0);
if(QA_MODE) setTimeout(()=> {
  const r = runQA();
  const bad = r.rows.filter(x=>x.docY>1||x.docX>1);
  openModal(`QA (${r.viewport})`, `<p>Checked ${r.rows.length} views · Document overflows: <strong>${bad.length}</strong></p>`, `<button class="btn-primary" id="qaOk">تمام</button>`);
  document.getElementById('qaOk').onclick = closeModal;
}, 120);
})();
</script>
